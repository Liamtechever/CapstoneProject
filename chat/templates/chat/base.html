{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Capstone Assistant{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'chat/app.css' %}">
  <script src="{% static 'chat/app.js' %}" defer></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="site-header">
    <a class="brand" href="{% url 'chat' %}"><span class="brand-mark" aria-hidden="true">C</span> Capstone Assistant</a>
    <span class="badge">Research prototype</span>
  </header>
  <main id="main">{% block content %}{% endblock %}</main>
  <footer>Local and hosted language models · A Python capstone project</footer>
</body>
</html>
